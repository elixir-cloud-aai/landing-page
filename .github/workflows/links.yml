# Weekly dead-link check. Not a required PR check, because external sites go
# down at random and would block merges. Opens (or updates) one issue instead,
# only for dead links (404/410, DNS or TLS errors). Links that still fail with
# server or network errors after a retry are unverified: they appear in the
# job summary of every run, and in the issue when there are dead links too.
name: Link check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check links
        id: check
        run: |
          set +e
          node scripts/check-links.mjs > links.txt
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat links.txt
          {
            echo '```'
            sed -n '/^Checked /,$p' links.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 2 means dead links (reported below); anything else non-zero means
          # the check itself broke
          if [ "$status" != 0 ] && [ "$status" != 2 ]; then exit "$status"; fi

      - name: Report dead links
        if: steps.check.outputs.status == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Dead links on the website"
          {
            echo "The weekly link check found dead links ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))."
            echo
            echo '```'
            sed -n '/^Checked /,$p' links.txt
            echo '```'
          } > body.md
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
