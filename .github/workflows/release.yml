# Release when a version tag (`vYYYY.M.MICRO`, see "Releasing" in `README.md`)
# is pushed: check the tag, the version in `package.json` and that CI passed
# for its commit (`prepare`); build and push the Docker image (with SBOM and
# provenance attestations) by digest, untagged (`push`); scan exactly that
# digest for vulnerabilities in a job of its own, without the release
# credentials and signing identity (`scan`); and only then attest its build
# provenance, sign it (Sigstore keyless signing), tag it, and create the GitHub
# release with GitHub's generated notes (`publish`). `push` and `publish` each
# need approval in the `release` environment (required reviewer). Re-running
# all jobs builds, scans, signs and tags a new digest, but stops before building
# if the version tag exists (released images don't change); re-running failed
# jobs reuses the digest already pushed. Once `publish` has tagged the image,
# re-run only the failed jobs: a new attempt of all jobs stops at the existing
# tag and supersedes the attempt whose failed jobs could finish the release.
# Release commits are on `dev`, and `main` is moved forward to them before they
# are tagged. Adapted from cloud-registry-ui's release workflow; unlike there,
# versions are calendar versions without pre-releases, there is no
# `CITATION.cff`, and the image has one build argument.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Fully qualified (`docker.io/`), as the attestation needs it. The Docker Hub
# organization is the repository variable `DOCKERHUB_ORG` (by default
# `elixircloud`), so that forks can publish to their own organization
env:
  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/landing-page

# One run per tag, so that a run waiting for approval is not cancelled by the
# run of another tag; `latest` is decided at the end of each run, from freshly
# fetched tags on `main`
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # read the CI runs of the release commit
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and all tags, to check that the release commit is on
          # `main`
          fetch-depth: 0
      # "Releasing" in `README.md` runs the checks of this job that need no tag
      # before tagging: keep them in sync. Guards against accidental releases,
      # e.g., of unmerged commits; the `release` environment's protection rules
      # (required reviewer) are what actually control publishing
      - name: Check release tag and commit
        id: version
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # vYYYY.M.MICRO; month and MICRO without leading zeros
          pattern='^v20[0-9]{2}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$'
          if [[ ! "${TAG}" =~ ${pattern} ]]; then
              echo "::error::Tag '${TAG}' is not a release version (vYYYY.M.MICRO, e.g., v2026.11.0)"
              exit 1
          fi
          # A tag can't be removed, and a version in the future would stay the
          # highest one, which keeps later releases from becoming `latest`
          IFS=. read -r year month _ <<< "${TAG#v}"
          if (( year * 100 + month > $(date -u +%Y%m) )); then
              echo "::error::Tag '${TAG}' is for a month in the future"
              exit 1
          fi
          # Annotated, with a signature that GitHub verified
          if [[ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]]; then
              echo "::error::Tag '${TAG}' is not annotated (git tag -s)"
              exit 1
          fi
          verified="$(gh api "repos/${REPOSITORY}/git/tags/$(git rev-parse "refs/tags/${TAG}")" \
              --jq .verification.verified)"
          if [[ "${verified}" != "true" ]]; then
              echo "::error::Tag '${TAG}' has no signature verified by GitHub (git tag -s)"
              exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Release commit is not on 'main' (move 'main' to it first: git push origin <sha>:main)"
              exit 1
          fi
          {
              echo "version=${TAG#v}"
              echo "sha=$(git rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"
      # The version of the release is set in the release commit, so that the
      # sources and the tag agree
      - name: Check version in package.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          package="$(jq -r .version package.json)"
          if [[ "${package}" != "${VERSION}" ]]; then
              echo "::error::Version in package.json ('${package}') doesn't match the tag ('${VERSION}')"
              exit 1
          fi
      # The checks above don't run the tests: require a successful run of the
      # CI workflow for a push of the release commit to `dev` (before `main`
      # moved to it); runs for pull requests test merge commits, not the commit
      # itself. Re-runs that succeeded count
      - name: Check that CI passed for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          runs="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&branch=dev&event=push&status=success&per_page=1" \
              --jq .total_count)"
          if [[ ! "${runs}" =~ ^[0-9]+$ || "${runs}" -lt 1 ]]; then
              echo "::error::No successful run of the CI workflow (ci.yml) for a push of ${SHA} to dev; once CI passed for it, re-run this workflow"
              exit 1
          fi

  # Builds the image of the release commit once and pushes it by digest only
  # (untagged, with SBOM and provenance attestations), for `scan` to scan and
  # `publish` to sign and tag. Digests of runs that fail (or fail the scan) are
  # never signed or tagged, but stay on Docker Hub, untagged (pullable by digest
  # only)
  push:
    name: Push image
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Docker Hub secrets (required reviewer)
    environment: release
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      # The commit checked by `prepare`
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # OCI labels with the version, commit and source; `tags` only sets the
      # version label (the image is tagged by digest in `publish`, after the
      # scan)
      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.prepare.outputs.version }}
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Released images don't change: if the version tag exists (e.g. when
      # re-running all jobs of a release), stop before building
      - name: Check that the version isn't released yet
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # The digest of the version tag, if it exists; errors other than "not
          # found" stop the run, so that it never passes by mistake
          status=0
          output="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" \
              --format '{{ json .Manifest }}' 2>&1)" || status=$?
          current=""
          if [[ "${status}" == 0 ]]; then
              current="$(jq -r .digest <<< "${output}")"
          elif ! grep -qiE 'not found|manifest unknown' <<< "${output}"; then
              echo "::error::Cannot check whether ${IMAGE_NAME}:${VERSION} exists: ${output}"
              exit 1
          fi
          if [[ -n "${current}" ]]; then
              echo "::error::${IMAGE_NAME}:${VERSION} exists already (${current}); release a new version instead"
              exit 1
          fi
      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          labels: ${{ steps.meta.outputs.labels }}
          # Public value, not a secret: it is visible in the page source. It
          # goes into the build because the pages are rendered at build time
          build-args: GA_MEASUREMENT_ID=${{ vars.GA_MEASUREMENT_ID }}

  # Scans exactly the pushed digest (`<image>@<digest>`; public, so pulling it
  # needs no login) with Trivy (shared action of elixir-cloud-aai/.github,
  # pinned to the commit of a release; fails on fixable critical and high
  # vulnerabilities, except those accepted in `.trivyignore.yaml`). Kept apart
  # from `push` and `publish`, so that Trivy never runs next to the Docker Hub
  # credentials, the `contents: write` token and the signing identity
  scan:
    name: Scan image
    needs: [prepare, push]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # For `.trivyignore.yaml`
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Check image digest
        env:
          DIGEST: ${{ needs.push.outputs.digest }}
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest '${DIGEST}'"
              exit 1
          fi
      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ needs.push.outputs.digest }}
          category: release
          upload: 'false'

  publish:
    name: Publish image
    needs: [prepare, push, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # create the GitHub release
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DIGEST: ${{ needs.push.outputs.digest }}
    steps:
      # The commit checked by `prepare`, with all tags, to find the previous
      # release
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Check image digest
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest '${DIGEST}'"
              exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Released images don't change: a version tag of another digest stops the
      # run before this digest is attested and signed (the same digest, e.g.
      # when re-running failed jobs, is fine)
      - name: Check the version tag
        run: |
          # The digest of the version tag, if it exists; errors other than "not
          # found" stop the run, so that it never passes by mistake
          status=0
          output="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" \
              --format '{{ json .Manifest }}' 2>&1)" || status=$?
          current=""
          if [[ "${status}" == 0 ]]; then
              current="$(jq -r .digest <<< "${output}")"
          elif ! grep -qiE 'not found|manifest unknown' <<< "${output}"; then
              echo "::error::Cannot check whether ${IMAGE_NAME}:${VERSION} exists: ${output}"
              exit 1
          fi
          if [[ -n "${current}" && "${current}" != "${DIGEST}" ]]; then
              echo "::error::${IMAGE_NAME}:${VERSION} already points to ${current}; release a new version instead"
              exit 1
          fi
      # Of the scanned digest
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The signature covers the digest, and so every tag of it
      - name: Sign image
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      # Decided last, from freshly fetched tags (the repository is public, so no
      # credentials are needed), so that neither a re-run of an older release
      # nor a concurrent release moves `latest` back: the highest release among
      # the tags on `main`, so that stray tags are ignored, leaving out months
      # in the future, which `prepare` rejects. `sort -V` orders calendar
      # versions correctly (v2026.9.0 before v2026.11.0). Production follows
      # `latest`, so a release that doesn't move it says so
      - name: Check whether this is the highest release
        id: latest
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          latest=false
          git init --quiet repo
          cd repo
          git fetch --quiet --filter=blob:none --tags "${REPOSITORY_URL}" \
              "+refs/heads/main:refs/remotes/origin/main"
          highest="$(git tag -l 'v*' --merged origin/main \
              | grep -E '^v20[0-9]{2}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$' \
              | awk -F '[v.]' -v now="$(date -u +%Y%m)" '$2 * 100 + $3 <= now' \
              | sort -V | tail -n 1 || true)"
          if [[ "${highest}" == "${TAG}" ]]; then
              latest=true
          else
              echo "::warning::Highest release on main is ${highest:-none}, not ${TAG}: 'latest' stays as it is, and production doesn't update; release a version above it"
          fi
          echo "latest=${latest}" >> "${GITHUB_OUTPUT}"
      # Tags `YYYY.M.MICRO` (and `latest`, which production follows, see
      # `docker-compose.yaml`) point to the checked, scanned and signed digest:
      # a single source is copied as is
      - name: Tag image
        env:
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          tags=("${IMAGE_NAME}:${VERSION}")
          if [[ "${LATEST}" == "true" ]]; then
              tags+=("${IMAGE_NAME}:latest")
          fi
          for tag in "${tags[@]}"; do
              docker buildx imagetools create --tag "${tag}" "${IMAGE_NAME}@${DIGEST}"
              actual="$(docker buildx imagetools inspect "${tag}" \
                  --format '{{ json .Manifest }}' | jq -r .digest)"
              if [[ "${actual}" != "${DIGEST}" ]]; then
                  echo "::error::${tag} points to ${actual}, expected ${DIGEST}"
                  exit 1
              fi
          done
      # A draft first, published last, so that immutable releases (a repository
      # setting) can still get their notes; re-runs finish the draft of an
      # earlier attempt and leave a published release as it is. GitHub's
      # generated notes list the pull requests merged since the previous
      # release: the highest version tag in the history of the release commit,
      # on another commit, that has a published release. Tags without one (e.g.
      # of a failed run) don't count; without any, GitHub picks the start, e.g.
      # all changes for the first release. The maintainers check the notes and
      # add the curated sections afterwards (the notes of published releases
      # stay editable)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          # only "not found" means no release: other errors stop the run, so
          # that a re-run never creates a second draft
          status=0
          state="$(gh release view "${TAG}" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>&1)" || status=$?
          if [[ "${status}" != 0 ]]; then
              if [[ "${state}" != *"release not found"* ]]; then
                  echo "::error::Cannot check whether release ${TAG} exists: ${state}"
                  exit 1
              fi
              state=none
          fi
          if [[ ! "${state}" =~ ^(draft|published|none)$ ]]; then
              echo "::error::Unexpected state of release ${TAG}: ${state}"
              exit 1
          fi
          if [[ "${state}" == "published" ]]; then
              echo "Release ${TAG} is already published: left as it is"
              exit 0
          fi
          if [[ "${state}" == "none" ]]; then
              published="$(gh release list --limit 1000 --exclude-drafts \
                  --json tagName --jq '.[].tagName')"
              previous=""
              head="$(git rev-parse HEAD)"
              while read -r tag; do
                  if [[ "$(git rev-parse "${tag}^{commit}")" == "${head}" ]]; then
                      continue
                  fi
                  if grep -qxF -- "${tag}" <<< "${published}"; then
                      previous="${tag}"
                      break
                  fi
              done < <(git tag -l 'v*' --merged HEAD --sort=-v:refname)
              args=(-f "tag_name=${TAG}")
              if [[ -n "${previous}" ]]; then
                  args+=(-f "previous_tag_name=${previous}")
              fi
              notes="$(mktemp)"
              gh api "repos/${GH_REPO}/releases/generate-notes" "${args[@]}" \
                  --jq .body > "${notes}"
              gh release create "${TAG}" \
                  --draft \
                  --verify-tag \
                  --title "${TAG}" \
                  --notes-file "${notes}"
          fi
          gh release edit "${TAG}" --title "${TAG}" \
              --latest="${LATEST}" --draft=false
