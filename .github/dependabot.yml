version: 2
# Every entry targets `dev`, the default branch (`target-branch`)
updates:
  # Dependencies in `package.json` and the lock (`package-lock.json`)
  - package-ecosystem: npm
    directory: /
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      # Major updates stay in PRs of their own, so they can't block the rest
      node-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  # Actions in the workflows, including the pins of the shared actions of
  # `elixir-cloud-aai/.github` (to the commits of its releases,
  # `@<commit> # vX.Y.Z`)
  - package-ecosystem: github-actions
    directory: /
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      github-actions:
        patterns: ["*"]
  # Images in the `Dockerfile`
  - package-ecosystem: docker
    directory: /
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      docker:
        patterns: ["*"]
  # Images in `docker-compose.yaml`
  - package-ecosystem: docker-compose
    directory: /
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      docker-compose:
        patterns: ["*"]
