# Production deployment for https://elixir-on.cloud/
#
# The Release workflow tags the image of the highest release `latest` on Docker
# Hub. Watchtower checks Docker Hub every 5 minutes and restarts the site when
# the image changes, so the host never needs inbound access from GitHub.
#
#   docker compose up -d          # start (or update this file and re-run)
#   docker compose logs -f site   # follow the site's logs
#
# Until the first release has finished, `latest` on Docker Hub is an image
# from 2024: don't pull or `docker compose up` a host that runs the GHCR image
# with this file before then. To move a host from GHCR or to roll back, see
# "Deployment" in README.md. To build locally instead of pulling:
# docker compose up -d --build
services:
  site:
    image: elixircloud/landing-page:latest
    container_name: landing-page
    build:
      context: .
    restart: unless-stopped
    ports:
      - '80:3000'
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Only update containers that opt in via the label above; remove old images.
    command: --label-enable --cleanup --interval 300
